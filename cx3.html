      function PreloadImages() {
        var preload_images = [
          // "https://prepware.com/cx3e/img/calculator_keypad.png",
          "https://prepware.com/cx3e/img/logo.png",
          "https://prepware.com/cx3e/img/status_check_black.png",
          "https://prepware.com/cx3e/img/status_check_white.png",
          "https://prepware.com/cx3e/img/status_equals_black.png",
          "https://prepware.com/cx3e/img/status_equals_white.png",
          "https://prepware.com/cx3e/img/status_global_black.png",
          "https://prepware.com/cx3e/img/status_global_white.png",
          "https://prepware.com/cx3e/img/status_question_black.png",
          "https://prepware.com/cx3e/img/status_question_white.png",
        ];
        var preload_image = new Image();
        for (i in preload_images) {
          preload_image.src = preload_images[i];
        }
      }
      PreloadImages();
    </script>

      <div class="widget cx3-timer">
        <span class="sign"></span><span class="hours"></span
        ><span class="hours"></span><span class="filler">:</span
        ><span class="minutes"></span><span class="minutes"></span
        ><span class="filler">:</span><span class="seconds"></span

      </div>
      <div class="widget timer-labels">

        <div class="seconds">Secs</div>
        <div class="minutes">Mins</div>
      </div>
    </div>
