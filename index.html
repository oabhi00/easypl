<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Meta Tags -->
  <title>EasyPL - Aviation Mock Exam Practice Platform</title>
  <meta name="description" content="Prepare for your DGCA aviation exams with our comprehensive testing platform. Track your scores, accuracy, and practice across Air Navigation, Meteorology, Regulations, and Technical subjects.">
  <meta name="keywords" content="DGCA, aviation mock exams, pilot test, Air Navigation, Air Regulations, Meteorology, pilot preparation, mock test practice">
  <meta name="author" content="EasyPL Team">
  
  <!-- OG Meta Tags -->
  <meta property="og:title" content="EasyPL - Aviation Mock Exam Practice Platform">
  <meta property="og:description" content="Master your DGCA subjects (Meteorology, Navigation, Regulations, and Technical) with real-time test simulations and metrics tracking.">
  <meta property="og:type" content="website">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body>
  <script>
    (function() {
      // System Theme Sync
      const savedTheme = localStorage.getItem('easypl_theme');
      if (savedTheme === 'light' || (!savedTheme && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.body.classList.add('light-mode');
      }

      // Anti-Scraping & DevTools Protections
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('copy', (e) => e.preventDefault());
      document.addEventListener('cut', (e) => e.preventDefault());
      
      document.addEventListener('keydown', (e) => {
        // Disable F12, Ctrl+Shift+I, Ctrl+Shift+C, Ctrl+Shift+J, Ctrl+U
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'C' || e.key === 'c' || e.key === 'J' || e.key === 'j')) ||
          (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
        ) {
          e.preventDefault();
          return false;
        }
      });
    })();
  </script>

  <!-- Global Sky Background -->
  <div class="global-sky-bg">
    <div class="sky-sun-moon"></div>
    <div class="stars-container"></div>
    
    <!-- Poster Parallax Elements -->
    <div class="poster-parallax-bg">
      <div class="parallax-element cloud-left"><div class="cloud-drift"><img src="images/image2.svg" alt="Cloud"></div></div>
      <div class="parallax-element cloud-right"><div class="cloud-drift"><img src="images/image2.svg" alt="Cloud"></div></div>
      <div class="parallax-element cloud-center"><div class="cloud-drift"><img src="images/image2.svg" alt="Cloud"></div></div>
      
      <div class="parallax-element jet-right"><img src="images/easypl_aircraft.png" alt="Jet Right"></div>
    </div>
  </div>


  <!-- Theme Toggle Floating Button -->
  <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Cockpit Light/Dark Theme">
    <!-- Sun Icon (shown in dark mode) -->
    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <!-- Moon Icon (shown in light mode) -->
    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <!-- Main App Shell -->
  <main id="app" class="animate-fade-in">
    <!-- Views will be dynamically loaded here by js/app.js -->
    <div class="flex-center" style="min-height: 80vh; flex-direction: column; gap: 0rem; justify-content: center;">
      <img src="images/easypl_logo.svg" alt="EasyPL Logo" class="logo-img-splash" />
    </div>
  </main>

  <!-- Application Initialization Script -->
  <script type="module">
    import { app } from './js/app.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      // Small artificial load delay for smooth transition feel
      setTimeout(() => {
        app.init('app');
      }, 500);
    });
  </script>

  <!-- Floating Logo (Bottom Right) -->
  <div class="floating-logo-container">
    <img src="images/easypl_logo.svg" alt="EasyPL Floating Logo" class="floating-logo">
  </div>

</body>
</html>
