<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Meta Tags -->
  <title>EasyPL - Aviation Mock Exam Practice Platform</title>
  <meta name="description" content="Prepare for your DGCA aviation exams with our comprehensive testing platform. Track your scores, accuracy, and practice across Air Navigation, Meteorology, Regulations, and Technical subjects.">
  <meta name="keywords" content="DGCA, aviation mock exams, pilot test, Air Navigation, Air Regulations, Meteorology, pilot preparation, mock test practice">
  <meta name="author" content="EasyPL Team">
  
  <!-- OG Meta Tags -->
  <meta property="og:title" content="EasyPL - Aviation Mock Exam Practice Platform">
  <meta property="og:description" content="Master your DGCA subjects (Meteorology, Navigation, Regulations, and Technical) with real-time test simulations and metrics tracking.">
  <meta property="og:type" content="website">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('easypl_theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
      }
    })();
  </script>

  <!-- Dynamic Sky Background with Moving Clouds for Landing Page -->
  <div class="landing-sky-bg">
    <div class="sky-sun-moon"></div>
    <div class="cloud cloud-1">
      <svg viewBox="0 0 100 60"><path d="M 25 45 A 15 15 0 0 1 38 25 A 22 22 0 0 1 72 25 A 15 15 0 0 1 85 45 A 10 10 0 0 1 75 55 L 25 55 A 10 10 0 0 1 25 45 Z" /></svg>
    </div>
    <div class="cloud cloud-2">
      <svg viewBox="0 0 100 60"><path d="M 25 45 A 15 15 0 0 1 38 25 A 22 22 0 0 1 72 25 A 15 15 0 0 1 85 45 A 10 10 0 0 1 75 55 L 25 55 A 10 10 0 0 1 25 45 Z" /></svg>
    </div>
    <div class="cloud cloud-3">
      <svg viewBox="0 0 100 60"><path d="M 25 45 A 15 15 0 0 1 38 25 A 22 22 0 0 1 72 25 A 15 15 0 0 1 85 45 A 10 10 0 0 1 75 55 L 25 55 A 10 10 0 0 1 25 45 Z" /></svg>
    </div>
    <!-- Centered: Interactive Background Attitude Indicator -->
    <div class="landing-bg-attitude">
      <svg class="bg-attitude-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="bgAiClip">
            <circle cx="100" cy="100" r="85" />
          </clipPath>
          <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="var(--ai-sky-1)" />
            <stop offset="60%" stop-color="var(--ai-sky-2)" />
            <stop offset="100%" stop-color="var(--ai-sky-3)" />
          </linearGradient>
          <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="var(--ai-ground-1)" />
            <stop offset="100%" stop-color="var(--ai-ground-2)" />
          </linearGradient>
          <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- Outer Bezel Ring -->
        <circle cx="100" cy="100" r="92" fill="none" stroke="var(--ai-bezel)" stroke-width="2" opacity="var(--ai-bezel-opacity)" filter="url(#neonGlow)"/>
        <circle cx="100" cy="100" r="87" fill="none" stroke="var(--ai-bezel)" stroke-width="0.8" opacity="0.25"/>

        <!-- Bank Angle Markings -->
        <g transform="translate(100, 100)" stroke="var(--ai-ticks)" stroke-width="1" opacity="0.6">
          <polygon points="0,-87 -4,-80 4,-80" fill="var(--hud-amber)" stroke="none" />
          <line x1="0" y1="-87" x2="0" y2="-83" transform="rotate(10)" />
          <line x1="0" y1="-87" x2="0" y2="-83" transform="rotate(20)" />
          <line x1="0" y1="-87" x2="0" y2="-83" transform="rotate(30)" />
          <line x1="0" y1="-87" x2="0" y2="-81" stroke-width="1.5" transform="rotate(45)" />
          <line x1="0" y1="-87" x2="0" y2="-81" stroke-width="1.5" transform="rotate(60)" />
          
          <line x1="0" y1="-87" x2="0" y2="-83" transform="rotate(-10)" />
          <line x1="0" y1="-87" x2="0" y2="-83" transform="rotate(-20)" />
          <line x1="0" y1="-87" x2="0" y2="-83" transform="rotate(-30)" />
          <line x1="0" y1="-87" x2="0" y2="-81" stroke-width="1.5" transform="rotate(-45)" />
          <line x1="0" y1="-87" x2="0" y2="-81" stroke-width="1.5" transform="rotate(-60)" />
        </g>

        <!-- Clipped Horizon Ball -->
        <g clip-path="url(#bgAiClip)">
          <!-- Sky -->
          <rect x="-20" y="-20" width="240" height="240" fill="url(#skyGrad)"/>
          
          <!-- Rotatable/Translatable Horizon Group -->
          <g class="bg-horizon-group" style="transform-origin: 100px 100px; transition: transform 0.1s ease-out;">
            <!-- Ground -->
            <rect x="-40" y="100" width="280" height="200" fill="url(#groundGrad)" />
            <!-- Horizon Line -->
            <line x1="-40" y1="100" x2="240" y2="100" stroke="var(--ai-horizon-line)" stroke-width="1.5" />
            
            <!-- Pitch ladder lines -->
            <!-- Pitch +10 -->
            <line x1="85" y1="80" x2="115" y2="80" stroke="var(--ai-pitch-line)" stroke-width="0.75" />
            <line x1="85" y1="80" x2="85" y2="83" stroke="var(--ai-pitch-line)" stroke-width="0.75" />
            <line x1="115" y1="80" x2="115" y2="83" stroke="var(--ai-pitch-line)" stroke-width="0.75" />
            <text x="74" y="83" fill="var(--ai-pitch-line)" font-size="7" font-family="var(--font-mono)">10</text>
            <text x="119" y="83" fill="var(--ai-pitch-line)" font-size="7" font-family="var(--font-mono)">10</text>

            <!-- Pitch +20 -->
            <line x1="90" y1="60" x2="110" y2="60" stroke="var(--ai-pitch-line)" stroke-width="0.75" />
            <line x1="90" y1="60" x2="90" y2="63" stroke="var(--ai-pitch-line)" stroke-width="0.75" />
            <line x1="110" y1="60" x2="110" y2="63" stroke="var(--ai-pitch-line)" stroke-width="0.75" />
            <text x="79" y="63" fill="var(--ai-pitch-line)" font-size="7" font-family="var(--font-mono)">20</text>
            <text x="113" y="63" fill="var(--ai-pitch-line)" font-size="7" font-family="var(--font-mono)">20</text>

            <!-- Pitch -10 -->
            <line x1="85" y1="120" x2="115" y2="120" stroke="var(--ai-pitch-line)" stroke-width="0.75" stroke-dasharray="3 2" />
            <line x1="85" y1="120" x2="85" y2="117" stroke="var(--ai-pitch-line)" stroke-width="0.75" />
            <line x1="115" y1="120" x2="115" y2="117" stroke="var(--ai-pitch-line)" stroke-width="0.75" />
            <text x="74" y="123" fill="var(--ai-pitch-line)" font-size="7" font-family="var(--font-mono)">10</text>
            <text x="119" y="123" fill="var(--ai-pitch-line)" font-size="7" font-family="var(--font-mono)">10</text>

            <!-- Pitch -20 -->
            <line x1="90" y1="140" x2="110" y2="140" stroke="var(--ai-pitch-line)" stroke-width="0.75" stroke-dasharray="3 2" />
            <line x1="90" y1="140" x2="90" y2="137" stroke="var(--ai-pitch-line)" stroke-width="0.75" />
            <line x1="110" y1="140" x2="110" y2="137" stroke="var(--ai-pitch-line)" stroke-width="0.75" />
            <text x="79" y="143" fill="var(--ai-pitch-line)" font-size="7" font-family="var(--font-mono)">20</text>
            <text x="113" y="143" fill="var(--ai-pitch-line)" font-size="7" font-family="var(--font-mono)">20</text>
          </g>
        </g>

        <!-- Fixed Airplane Miniature Symbol in foreground -->
        <g filter="url(#neonGlow)">
          <rect x="60" y="98" width="28" height="3" fill="var(--hud-amber)" rx="0.5" />
          <rect x="112" y="98" width="28" height="3" fill="var(--hud-amber)" rx="0.5" />
          <circle cx="100" cy="100" r="3" fill="var(--hud-amber)" />
          <polygon points="100,95 97,100 103,100" fill="var(--hud-amber)" />
        </g>
      </svg>
    </div>
  </div>

  <!-- Background decorative elements for the design system -->
  <div class="decor-glow-1"></div>
  <div class="decor-glow-2"></div>

  <!-- Premium glass cockpit HUD background overlay -->
  <div class="hud-background-overlay">
    <svg class="hud-svg" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Central crosshair -->
      <circle cx="500" cy="500" r="120" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 6" />
      <circle cx="500" cy="500" r="250" stroke="var(--border)" stroke-width="0.75" />
      
      <!-- Compass ticks around the inner circle -->
      <g transform="translate(500,500)">
        <line x1="0" y1="-250" x2="0" y2="-240" stroke="var(--border)" stroke-width="1.5"/>
        <text x="0" y="-255" text-anchor="middle" fill="var(--accent)" font-family="var(--font-mono)" font-size="10" font-weight="bold">N</text>
        
        <line x1="250" y1="0" x2="240" y2="0" stroke="var(--border)" stroke-width="1.5"/>
        <text x="262" y="4" text-anchor="middle" fill="var(--accent)" font-family="var(--font-mono)" font-size="10" font-weight="bold">E</text>
        
        <line x1="0" y1="250" x2="0" y2="240" stroke="var(--border)" stroke-width="1.5"/>
        <text x="0" y="265" text-anchor="middle" fill="var(--accent)" font-family="var(--font-mono)" font-size="10" font-weight="bold">S</text>
        
        <line x1="-250" y1="0" x2="-240" y2="0" stroke="var(--border)" stroke-width="1.5"/>
        <text x="-262" y="4" text-anchor="middle" fill="var(--accent)" font-family="var(--font-mono)" font-size="10" font-weight="bold">W</text>
        
        <!-- 45 deg ticks -->
        <line x1="-176.7" y1="-176.7" x2="-169.7" y2="-169.7" stroke="var(--border)" stroke-width="1"/>
        <line x1="176.7" y1="-176.7" x2="169.7" y2="-169.7" stroke="var(--border)" stroke-width="1"/>
        <line x1="176.7" y1="176.7" x2="169.7" y2="169.7" stroke="var(--border)" stroke-width="1"/>
        <line x1="-176.7" y1="176.7" x2="-169.7" y2="169.7" stroke="var(--border)" stroke-width="1"/>
      </g>
      
      <!-- Dynamic pitch ladder marks -->
      <path d="M 450 400 L 550 400 M 470 380 L 530 380 M 470 420 L 530 420 M 430 450 L 570 450" stroke="var(--border)" stroke-width="0.75" opacity="0.5"/>
      <path d="M 450 600 L 550 600 M 470 580 L 530 580 M 470 620 L 530 620 M 430 550 L 570 550" stroke="var(--border)" stroke-width="0.75" opacity="0.5"/>
      
      <!-- Flight path vectors/horizontal lines -->
      <line x1="100" y1="500" x2="400" y2="500" stroke="var(--border)" stroke-width="1" stroke-dasharray="10 10"/>
      <line x1="600" y1="500" x2="900" y2="500" stroke="var(--border)" stroke-width="1" stroke-dasharray="10 10"/>
      
      <!-- Corner bracket decorations -->
      <path d="M 50 100 L 50 50 L 100 50" stroke="var(--border)" stroke-width="1.5" opacity="0.3"/>
      <path d="M 950 100 L 950 50 L 900 50" stroke="var(--border)" stroke-width="1.5" opacity="0.3"/>
      <path d="M 50 900 L 50 950 L 100 950" stroke="var(--border)" stroke-width="1.5" opacity="0.3"/>
      <path d="M 950 900 L 950 950 L 900 950" stroke="var(--border)" stroke-width="1.5" opacity="0.3"/>
      
    </svg>
  </div>

  <!-- Theme Toggle Floating Button -->
  <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Cockpit Light/Dark Theme">
    <!-- Sun Icon (shown in dark mode) -->
    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <!-- Moon Icon (shown in light mode) -->
    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <!-- Main App Shell -->
  <main id="app" class="animate-fade-in">
    <!-- Views will be dynamically loaded here by js/app.js -->
    <div class="flex-center" style="min-height: 80vh; flex-direction: column; gap: 1rem;">
      <h1 class="text-gradient" style="font-size: 2.5rem; font-family: 'Outfit', sans-serif;">EasyPL</h1>
      <p style="color: var(--text-secondary);">Loading your aviation exams...</p>
    </div>
  </main>

  <!-- Application Initialization Script -->
  <script type="module">
    import { app } from './js/app.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      // Small artificial load delay for smooth transition feel
      setTimeout(() => {
        app.init('app');
      }, 500);
    });
  </script>

</body>
</html>
