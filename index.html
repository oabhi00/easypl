<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Meta Tags -->
  <title>SkyPrep DGCA - Aviation Mock Exam Practice Platform</title>
  <meta name="description" content="Prepare for your DGCA aviation exams with our comprehensive testing platform. Track your scores, accuracy, and practice across Air Navigation, Meteorology, Regulations, and Technical subjects.">
  <meta name="keywords" content="DGCA, aviation mock exams, pilot test, Air Navigation, Air Regulations, Meteorology, pilot preparation, mock test practice">
  <meta name="author" content="SkyPrep DGCA Team">
  
  <!-- OG Meta Tags -->
  <meta property="og:title" content="SkyPrep DGCA - Aviation Mock Exam Practice Platform">
  <meta property="og:description" content="Master your DGCA subjects (Meteorology, Navigation, Regulations, and Technical) with real-time test simulations and metrics tracking.">
  <meta property="og:type" content="website">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body>

  <!-- Background decorative elements for the design system -->
  <div class="decor-glow-1"></div>
  <div class="decor-glow-2"></div>

  <!-- Main App Shell -->
  <main id="app" class="animate-fade-in">
    <!-- Views will be dynamically loaded here by js/app.js -->
    <div class="flex-center" style="min-height: 80vh; flex-direction: column; gap: 1rem;">
      <h1 class="text-gradient" style="font-size: 2.5rem; font-family: 'Outfit', sans-serif;">SkyPrep DGCA</h1>
      <p style="color: var(--text-secondary);">Initializing aviation testing terminal...</p>
    </div>
  </main>

  <!-- Application Initialization Script -->
  <script type="module">
    import { app } from './js/app.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      // Small artificial load delay for smooth transition feel
      setTimeout(() => {
        app.init('app');
      }, 500);
    });
  </script>

</body>
</html>
